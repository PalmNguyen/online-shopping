<!-- KHUNG BỌC PHỦ TOÀN MÀN HÌNH (Thêm class 'hidden' mặc định) -->
<div
  id="mini-cart"
  class="fixed inset-0 z-[999] opacity-0 pointer-events-none transition-opacity duration-300 flex justify-end"
>
  <!-- Lớp mờ nền xám (#787878 mờ 41% chuẩn Figma) -->
  <div
    id="cart-backdrop"
    class="fixed inset-0 bg-[#787878]/41 cursor-pointer"
  ></div>

  <!-- NỘI DUNG MINI CART (Kích thước 741px x 990px) -->
  <div
    id="cart-panel"
    class="relative w-full xl:w-[741px] h-full xl:h-[990px] bg-white p-0 border-none shadow-2xl z-10 flex flex-col justify-between overflow-y-auto translate-x-full transition-transform duration-300"
  >
    <!-- THẺ DIV 1: Từ Shopping Cart đến đường cắt ngang -->
    <div
      class="w-full flex flex-col gap-8 xl:gap-[67px] p-5 xl:pt-[45px] xl:px-[64px]"
    >
      <!-- DIV CON 1: Header & Dòng Free Shipping -->
      <div class="w-full flex flex-col gap-4 xl:gap-[26px]">
        <div class="w-full flex items-center justify-between">
          <h2
            class="font-volkhov font-normal text-3xl xl:text-[42px] leading-tight xl:leading-[32px] text-black"
          >
            Shopping Cart
          </h2>
          <button
            type="button"
            id="close-cart-btn"
            aria-label="Close Shopping Cart"
            class="w-6 h-6 flex items-center justify-center p-1 hover:opacity-60 cursor-pointer"
          >
            <img
              src="./assets/img/nutx.svg"
              alt="Close"
              class="w-full h-full object-contain"
            />
          </button>
        </div>

        <p
          class="font-poppins font-normal text-lg xl:text-[26px] leading-snug xl:leading-[32px] text-medium-gray"
        >
          Buy <span class="font-bold text-black">$122.35</span> More And Get
          <span class="font-bold text-black">Free Shipping</span>
        </p>
      </div>

      <!-- DIV CON 2: Thông tin sản phẩm & Đường cắt ngang 1 -->
      <!-- Vùng chứa danh sách sản phẩm động (JS sẽ bơm HTML vào đây) -->
      <div
        id="mini-cart-items"
        class="w-full flex flex-col items-start gap-[6px]"
      >
        <!-- Để trống ruột bên trong -->
      </div>
    </div>
    <!-- THẺ DIV 2: Từ dòng For $10.00 đến View Cart -->
    <div
      class="w-full flex flex-col gap-8 xl:gap-[45px] p-5 xl:px-[64px] xl:pb-[45px]"
    >
      <!-- SUB-DIV 1: Checkbox Wrap Product + Đường cắt ngang 2 -->
      <div class="w-full flex flex-col gap-[21px]">
        <div class="flex items-center gap-3 xl:gap-4">
          <label
            class="relative flex items-center justify-center w-[28px] h-[28px] xl:w-[32px] xl:h-[32px] shrink-0 cursor-pointer"
          >
            <input
              type="checkbox"
              id="wrap-product"
              class="peer appearance-none w-[28px] h-[28px] xl:w-[32px] xl:h-[32px] border-[3px] border-black rounded-[2px] checked:bg-black cursor-pointer transition-colors"
            />
            <svg
              class="absolute w-4 h-4 xl:w-5 xl:h-5 text-white pointer-events-none hidden peer-checked:block"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="3"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </label>

          <label
            for="wrap-product"
            class="font-poppins font-normal text-base xl:text-[22px] leading-normal xl:leading-[42px] text-medium-gray cursor-pointer select-none"
          >
            For <span class="text-black font-bold">$10.00</span> Please Wrap The
            Product
          </label>
        </div>

        <!-- Thanh cắt ngang 2 -->
        <div class="w-full h-[1px] bg-[#00000039]"></div>
      </div>

      <!-- SUB-DIV 2: Subtotal, Checkout & View Cart -->
      <div class="w-full flex flex-col gap-[14px]">
        <div class="w-full flex flex-col gap-5 xl:gap-[29px]">
          <!-- Subtotal -->
          <div class="w-full flex items-center justify-between">
            <span
              class="font-volkhov font-normal text-lg xl:text-[22px] leading-[32px] text-black"
              >Subtotal</span
            >
            <span
              id="mini-cart-subtotal"
              class="font-volkhov font-normal text-lg xl:text-[22px] leading-[32px] text-black"
              >$0.00</span
            >
          </div>

          <!-- Nút Checkout -->
          <a
            href="?page=checkout"
            class="w-full h-[56px] xl:h-[66px] bg-black text-white font-poppins text-base font-normal rounded-[10px] shadow-[0px_20px_35px_rgba(0,0,0,0.15)] hover:opacity-90 transition-all cursor-pointer flex items-center justify-center block"
          >
            Checkout
          </a>
        </div>

        <!-- Link View Cart -->
        <a
          href="?page=cart"
          class="w-full font-volkhov font-normal text-lg xl:text-[22px] leading-[32px] text-black text-center underline hover:opacity-75 transition-opacity cursor-pointer block"
        >
          View Cart
        </a>
      </div>
    </div>
  </div>
</div>

<header class="w-full mt-6 md:mt-[70px] relative z-50 bg-white">
  <nav class="w-full max-w-7xl mx-auto px-4 xl:px-0 flex items-center justify-between relative">
    <!-- 1. LOGO -->
    <a href="?page=home" class="font-volkhov text-3xl md:text-[52px] font-normal leading-none text-dark-brown">
      FASCO
    </a>

    <!-- 2. MENU DESKTOP -->
    <ul class="hidden md:flex flex-row gap-[70px] font-poppins font-normal text-base leading-none text-dark-brown">
      <li><a href="?page=home" class="hover:text-gray-500 transition-colors">Home</a></li>
      <li><a href="?page=shop" class="hover:text-gray-500 transition-colors">Shop</a></li>
      <li><a href="?page=product" class="hover:text-gray-500 transition-colors">Products</a></li>
      
      <!-- Nút Pages có Dropdown -->
      <li class="relative">
        <button id="desktop-pages-btn" class="flex items-center gap-1 hover:text-gray-500 transition-colors cursor-pointer">
          Pages <img src="./assets/img/arrow-down.svg" alt="Dropdown" />
        </button>
        <!-- Khung Dropdown ẩn -->
        <ul id="desktop-pages-dropdown" class="hidden absolute top-full left-0 mt-2 w-40 bg-white shadow-lg rounded-md py-2 border border-gray-100 flex flex-col gap-2 z-50">
          <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">About Us</a></li>
          <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">Contact</a></li>
          <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">FAQ</a></li>
        </ul>
      </li>
    </ul>

    <!-- 3. CỤM ICON HÀNH ĐỘNG -->
    <div class="flex items-center">
      <!-- Icon Search -->
      <div class="relative">
        <button type="button" id="search-btn" aria-label="Search" class="px-2 md:px-[17px] py-[12px] hover:opacity-75 cursor-pointer">
          <img src="./assets/img/search.svg" alt="Search" />
        </button>
        <!-- Khung nhập tìm kiếm ẩn -->
        <form id="search-box" class="hidden absolute top-full right-0 mt-2 w-[250px] bg-white shadow-lg rounded-xl border border-gray-100 p-2 flex gap-2 z-50">
          <input type="text" placeholder="Search products..." class="w-full px-3 py-2 text-sm outline-none border border-gray-200 rounded-lg focus:border-black" />
          <button type="submit" class="bg-black text-white px-3 py-2 rounded-lg text-sm hover:bg-gray-800">Go</button>
        </form>
      </div>

      <!-- Icon Account -->
      <a href="?page=sign-in" aria-label="Account" class="px-2 md:px-[13px] py-[19px] hover:opacity-75 cursor-pointer">
        <img src="./assets/img/user.svg" alt="Account" />
      </a>

      <!-- Icon Wishlist -->
      <button type="button" aria-label="Wishlist" class="px-2 md:px-[13px] py-[19px] hover:opacity-75 cursor-pointer">
        <img src="./assets/img/starheadersub.svg" alt="Wishlist" />
      </button>

      <!-- Icon Cart -->
      <button type="button" id="open-cart-btn" aria-label="Open Cart" class="relative pl-2 md:pl-[13px] pr-[5px] py-[13px] hover:opacity-75 cursor-pointer">
        <img src="./assets/img/cart.svg" alt="Cart" />
        <!-- Bạn có thể thêm số lượng sản phẩm ở đây -->
       <span
          id="cart-badge"
          class="absolute top-[5px] right-[-5px] bg-[#DA3F3F] text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden"
        >
          0
        </span>
      </button>

      <!-- Nút Hamburger Menu (Mobile) -->
      <button id="mobile-menu-btn" aria-label="Toggle Navigation Menu" class="md:hidden p-2 text-black cursor-pointer focus:outline-none ml-2">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </nav>

  <!-- KHUNG MENU MOBILE (Ẩn mặc định) -->
  <div id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full bg-white shadow-md border-t border-gray-100 flex flex-col px-4 py-4 z-50">
    <a href="?page=home" class="py-3 border-b border-gray-50 text-dark-brown">Home</a>
    <a href="?page=shop" class="py-3 border-b border-gray-50 text-dark-brown">Shop</a>
    <a href="?page=product" class="py-3 border-b border-gray-50 text-dark-brown">Products</a>
    <a href="#" class="py-3 text-dark-brown flex justify-between items-center">Pages <img src="./assets/img/arrow-down.svg" class="w-4 h-4" /></a>
  </div>
</header>

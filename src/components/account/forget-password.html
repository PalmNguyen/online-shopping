<section class="w-full min-h-screen bg-[#F8F8F8] flex items-center justify-center p-4 xl:p-0 mx-auto overflow-hidden">
    
    <!-- KHUNG CARD UI CHÍNH -->
    <div class="w-full max-w-md md:max-w-3xl xl:max-w-[1920px] xl:h-[1077px] max-h-screen bg-white rounded-2xl xl:rounded-[30px] border border-[#DBDBDB] overflow-hidden shadow-xl flex flex-col xl:flex-row">
        
        <!-- CỘT BÊN TRÁI: BANNER -->
        <div class="w-full h-[250px] sm:h-[400px] xl:w-[949px] xl:h-full relative">
            <img
                src="/src/assets/img/Image_SignIn.png"
                alt="FASCO Sign In Banner 1" 
                class="w-full h-full object-cover absolute inset-0"
            />
        </div>

        <!-- CỘT BÊN PHẢI: FORM CHÍNH -->
        <div class="w-full flex flex-col bg-white p-6 sm:p-10 xl:w-[971px] xl:h-full xl:py-12 xl:px-12 2xl:pt-[91.7px] 2xl:pl-[187px] 2xl:pr-[118px] 2xl:pb-[187px] relative overflow-y-auto">
            
            <!-- DIV 1: LOGO FASCO -->
            <div class="w-full max-w-[218px] text-left mb-8 xl:mb-[197.3px]">
                <h1 class="font-volkhov font-normal text-4xl xl:text-[66.6px] leading-none text-[#484848] w-full ">
                    FASCO
                </h1>
            </div>
                
            <!-- DIV 2: KHUNG NỘI DUNG FORM -->
            <div class="w-full max-w-[666px] flex flex-col items-start justify-center">
                
                <!-- Title: Forget Password -->
                <h2 class="font-volkhov font-normal text-2xl xl:text-[30px] leading-[40px] text-black text-left mb-10 xl:mb-[55px] lg:w-[239px]">
                    Forget Password
                </h2>
            
                <!-- Form Khôi phục mật khẩu -->
                <form action="#" method="POST" class="w-full flex flex-col items-start">
                    
                    <!-- Lưới 4 ô Input -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-[18px] gap-y-[29px] w-full mb-10 xl:mb-[29px] text-left">
                    
                    <!-- First Name -->
                    <input 
                        type="text" 
                        placeholder="First Name" 
                        required 
                        class="w-full h-10 bg-transparent border-b border-[#9D9D9D] font-poppins font-normal text-[16px] leading-[40px] tracking-[0.08em] text-black placeholder:text-[#9D9D9D] focus:outline-none focus:border-black transition-colors"
                    />
                    
                    <!-- Last Name -->
                    <input 
                        type="text" 
                        placeholder="Last Name" 
                        required 
                        class="w-full h-10 bg-transparent border-b border-[#9D9D9D] font-poppins font-normal text-[16px] leading-[40px] tracking-[0.08em] text-black placeholder:text-[#9D9D9D] focus:outline-none focus:border-black transition-colors"
                    />

                    <!-- Email Address -->
                    <input 
                        type="email" 
                        placeholder="Email Address" 
                        required 
                        class="w-full h-10 bg-transparent border-b border-[#9D9D9D] font-poppins font-normal text-[16px] leading-[40px] tracking-[0.08em] text-black placeholder:text-[#9D9D9D] focus:outline-none focus:border-black transition-colors"
                    />

                    <!-- Phone Number -->
                    <input 
                        type="tel" 
                        placeholder="Phone Number" 
                        required 
                        class="w-full h-10 bg-transparent border-b border-[#9D9D9D] font-poppins font-normal text-[16px] leading-[40px] tracking-[0.08em] text-black placeholder:text-[#9D9D9D] focus:outline-none focus:border-black transition-colors"
                    />
                </div>

                    <!-- Nút Send Confirmation Code -->
                    <button 
                        type="submit"   
                        class="w-full h-12 xl:h-[60px] mx-auto xl:w-[575px] flex items-center justify-center bg-black text-white rounded-[10px] font-poppins font-semibold text-sm xl:text-[16px] xl:leading-[40px] hover:bg-neutral-800 transition-all shadow-[0_20px_35px_rgba(0,0,0,0.15)] mb-6 xl:mb-[29px] cursor-pointer"
                    >
                        Send Confirmation Code
                    </button>

                    <!-- Dòng chuyển hướng Login -->
                    <div class="w-full text-center xl:w-[294px] mx-auto">
                        <span class="font-poppins font-medium text-sm xl:text-[16px] xl:leading-[40px] text-black">
                            Already have an account?
                        </span>
                        <a 
                            href="?page=sign-in" 
                            class="font-poppins font-bold text-sm xl:text-[16px] xl:leading-[40px] text-[#5B86E5] hover:underline inline-block ml-1"
                        >
                            Login
                        </a>
                    </div>
                </form>
            </div>

            <!-- FOOTER -->
            <footer class="w-full flex items-center justify-end mt-auto pt-8 pb-4 xl:pb-0 pointer-events-none">
                <p class="font-poppins font-normal text-xs xl:text-[16px] xl:leading-[40px] text-black whitespace-nowrap pointer-events-auto">
                    FASCO Terms & Codnitions
                </p>
            </footer>
        </div>
    </div>
</section>

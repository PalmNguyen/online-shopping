<section class="min-h-screen flex items-center justify-center p-4 md:p-8 bg-white">
    <!-- Card Container (1280px) -->
    <div class="w-full max-w-[1280px] bg-white border border-[#DBDBDB] rounded-[30px] overflow-hidden shadow-xl flex flex-col lg:flex-row my-auto">
        
        <!-- CỘT BÊN TRÁI: BANNER -->
        <div class="w-full lg:w-1/2 min-h-[350px] lg:min-h-[700px] relative">
            <img
                src="/src/assets/img/image_1_account.png"
                alt="FASCO Sign In Banner" 
                class="w-full h-full object-cover absolute inset-0"
            />
        </div>

        <!-- CỘT BÊN PHẢI: FORM CHÍNH -->
        <div class="w-full lg:w-1/2 p-6 md:p-10 lg:pt-[91.7px] lg:pb-[40px] flex flex-col justify-between items-center bg-white">
            
            <!-- Khung chứa toàn bộ form bên phải -->
            <div class="w-full max-w-[575px] mx-auto flex flex-col items-start text-left">
                
                <!-- TITTLE -->
                <h1 class="font-volkhov font-normal text-4xl lg:text-[66.6px] leading-none text-[#484848] text-left mb-8 lg:mb-[82px] w-full">
                    FASCO
                </h1>
                
                <!-- 2. KHUNG FORM -->
                <div class="w-full flex flex-col items-start justify-center">
                    
                    <!-- Title Sign In To FASCO -->
                    <h2 class="font-volkhov font-normal text-2xl lg:text-[30px] leading-[40px] text-black text-left mb-[29px] w-full">
                        Sign In To FASCO
                    </h2>
                
                    <!-- Khung chứa 2 nút -->
                    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 w-full mb-[35px]">

                        <!-- Nút Google -->
                        <button type="button" class="w-full sm:flex-1 h-[55px] bg-white border border-[#5B86E5] rounded-[8px] flex items-center justify-center gap-3 hover:bg-gray-50 transition-colors cursor-pointer">
                            <img src="/src/assets/img/icongoogle.png" alt="Google Icon" class="w-5 h-5 object-contain" />
                            <span class="font-poppins font-normal text-[16px] leading-[40px] tracking-[0.08em] text-black">
                                Sign up with Google
                            </span>
                        </button>

                        <!-- Nút Email -->
                        <button type="button" class="w-full sm:flex-1 h-[55px] bg-white border border-[#5B86E5] rounded-[8px] flex items-center justify-center gap-3 hover:bg-gray-50 transition-colors cursor-pointer">
                            <img src="/src/assets/img/iconemail.png" alt="Email Icon" class="w-5 h-5 object-contain" />
                            <span class="font-poppins font-normal text-[16px] leading-[40px] tracking-[0.08em] text-black">
                                Sign up with Email
                            </span>  
                        </button>

                    </div>

                    <!-- Vạch chia — OR — -->
                    <div class="flex items-center justify-center w-full gap-4 mb-[29px]">
                        <span class="w-[30px] h-[5px] bg-[#838383]"></span>
                        <span class="font-poppins font-bold text-[24px] lg:text-[30px] leading-[40px] tracking-[0.08em] text-[#838383]">
                            OR
                        </span>
                        <span class="w-[30px] h-[5px] bg-[#838383]"></span>
                    </div>

                    <!-- Form Đăng Nhập -->
                    <form action="#" method="POST" class="w-full flex flex-col items-start">
                        
                        <!-- Input Email -->
                        <div class="w-full mb-6 text-left">
                            <input 
                                type="email" 
                                placeholder="Email" 
                                required
                                class="w-full h-[47px] bg-transparent border-b border-[#9D9D9D] text-sm text-black placeholder-[#9D9D9D] focus:outline-none focus:border-black transition-colors"
                            />
                        </div>

                        <!-- Input Password -->
                        <div class="w-full mb-8 text-left">
                            <input 
                                type="password" 
                                placeholder="Password" 
                                required
                                class="w-full h-[47px] bg-transparent border-b border-[#9D9D9D] text-sm text-black placeholder-[#9D9D9D] focus:outline-none focus:border-black transition-colors"
                            />
                        </div>

                        <!-- Nút Sign In -->
                        <button 
                            type="submit" 
                            class="w-full h-[60px] bg-black text-white rounded-[10px] text-sm font-medium hover:bg-neutral-800 transition-all shadow-[0_20px_35px_rgba(0,0,0,0.15)] mb-[19px] cursor-pointer"
                        >
                            Sign In
                        </button>

                        <!-- Nút Register Now -->
                        <a 
                            href="?page=sign-up" 
                            class="w-full h-[60px] flex items-center justify-center border border-[#5B86E5] text-[#5B86E5] rounded-[8px] font-poppins font-semibold text-[16px] leading-[40px] tracking-[0.08em] hover:bg-blue-50 transition-colors mb-[15px]"
                        >
                            Register Now
                        </a>

                        <!-- Forget Password? -->
                        <div class="w-full text-right">
                            <a 
                                href="?page=forget-password" 
                                class="font-poppins font-bold text-[16px] leading-[40px] tracking-[0.08em] text-[#5B86E5] hover:underline inline-block"
                            >
                                Forget Password?
                            </a>
                        </div>
                    </form>

                </div>

            </div>

            <!-- Footer FASCO Terms & Codnitions -->
            <p class="font-poppins font-normal text-[16px] leading-[40px] tracking-normal text-black mt-8 text-right w-full max-w-[575px]">
                FASCO Terms & Codnitions
            </p>

        </div>
    </div>
</section>

<section class="w-full min-h-screen bg-[#F8F8F8] flex items-center justify-center p-4 xl:p-0 mx-auto overflow-hidden">
    
    <!-- KHUNG CARD UI CHÍNH -->
    <div class="w-full max-w-md md:max-w-3xl xl:max-w-[1920px] xl:h-[1077px] max-h-screen bg-white rounded-2xl xl:rounded-[30px] border border-[#DBDBDB] overflow-hidden shadow-xl flex flex-col xl:flex-row">
        
        <!-- CỘT BÊN TRÁI: BANNER -->
        <div class="w-full h-[250px] sm:h-[400px] xl:w-[949px] xl:h-full relative">
            <img
                src="/src/assets/img/Image_SignIn.png"
                alt="FASCO Sign In Banner 1" 
                class="w-full h-full object-cover absolute inset-0"
            />
        </div>

        <!-- CỘT BÊN PHẢI: FORM CHÍNH -->
        <div class="w-full flex flex-col bg-white p-6 sm:p-10 xl:w-[971px] xl:h-full xl:py-12 xl:px-12 2xl:pt-[91.7px] 2xl:pl-[187px] 2xl:pr-[156px] 2xl:pb-[187px] relative overflow-y-auto">
            
            <!-- DIV 1: LOGO FASCO -->
            <div class="w-full max-w-[218px] text-left mb-8 xl:mb-[264.3px]">
                <h1 class="font-volkhov font-normal text-4xl xl:text-[66.6px] leading-none text-[#484848] w-full ">
                    FASCO
                </h1>
            </div>
                
            <!-- DIV 2: KHUNG NỘI DUNG FORM -->
            <div class="w-full max-w-[636px] flex flex-col items-start justify-center">
                
                <!-- Title: Enter Your New Password -->
                <h2 class="font-volkhov font-normal text-2xl xl:text-[30px] leading-[40px] text-black text-left mb-10 xl:mb-[65px] w-full">
                    Enter Your New Password
                </h2>
            
                <!-- Form Nhập mật khẩu mới -->
                <form action="#" method="POST" class="w-full flex flex-col items-start">
                    
                    <!-- Input New Password -->
                    <div class="w-full mb-8 lg:mb-[32px] text-left">
                        <input 
                            type="password" 
                            placeholder="New Password" 
                            required 
                            class="w-full h-10 xl:h-[47px] bg-transparent border-b border-[#9D9D9D] text-sm text-black placeholder-[#9D9D9D] focus:outline-none focus:border-black transition-colors"
                        />
                    </div>

                    <!-- Input Confirm New Password -->
                    <div class="w-full mb-10 lg:mb-[32px] text-left">
                        <input 
                            type="password" 
                            placeholder="Confirm New Password" 
                            required
                            class="w-full h-10 xl:h-[47px] bg-transparent border-b border-[#9D9D9D] text-sm text-black placeholder-[#9D9D9D] focus:outline-none focus:border-black transition-colors"
                        />
                    </div>

                    <!-- Nút Submit -->
                    <button 
                        type="submit" 
                        class="w-full h-12 xl:h-[60px] mx-auto xl:w-[575px] flex items-center justify-center bg-[#5B86E5] text-white rounded-[10px] font-poppins font-semibold text-sm xl:text-[16px] xl:leading-[40px] tracking-[0.08em] hover:bg-blue-600 transition-all shadow-[0_20px_35px_rgba(0,0,0,0.15)] cursor-pointer"
                    >
                        Submit
                    </button>
                </form>
            </div>

            <!-- FOOTER -->
            <footer class="w-full flex items-center justify-end mt-auto pt-8 pb-4 xl:pb-0 pointer-events-none">
                <p class="font-poppins font-normal text-xs xl:text-[16px] xl:leading-[40px] text-black whitespace-nowrap pointer-events-auto">
                    FASCO Terms & Codnitions
                </p>
            </footer>
        </div>
    </div>
</section>

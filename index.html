<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Shopping</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <div id="header-home-container"></div>
    <div id="homepage-container"></div>

    <script type="module">
      function loadComponent(id, filePath, callback) {
        fetch(filePath)
          .then(res => {
            if (!res.ok) throw new Error("Không tìm thấy file: " + filePath);
            return res.text();
          })
          .then(data => {
            document.getElementById(id).innerHTML = data;
            if (callback) callback(); // Chạy JS riêng khi load xong component
          })
          .catch(err => console.error(err));
      }

      // Gọi Header và kích hoạt file header.js
      loadComponent('header-home-container', '/src/components/header/home.html');
      loadComponent('homepage-container', '/src/components/homepage.html');
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>website-coffee-shop</title>
    <link rel="stylesheet" href="/src/input.css" />
  </head>

  <body>
    <div id="app"></div>

    <!-- KHUNG CHỨA HTML TỪ CÁC FILE LẺ -->
    <div id="header-container"></div>
    <div id="homepage-container"></div>

    <script type="module" src="/src/main.js"></script>

    <!-- Script tự động nhúng HTML -->
    <script>
      function loadComponent(id, filePath) {
        fetch(filePath)
          .then(res => res.text())
          .then(data => {
            document.getElementById(id).innerHTML = data;
          })
          .catch(err => console.error(`Lỗi load file ${filePath}:`, err));
      }

      // Kéo 2 file con từ thư mục components ở ngoài gốc
      loadComponent('header-container', '/components/header.html');
      loadComponent('homepage-container', '/components/homepage.html');
    </script>
  </body>
</html>

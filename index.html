<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>online-shopping</title>
    <link rel="stylesheet" href="/src/input.css" />
</head>

<body>
    <div id="header-home-container"></div>
    <div id="homepage-container"></div>

    <!-- Đường dẫn js chính -->
    <script type="module" src="/src/js/header-home.js"></script>

    <script type="module">
        import { initHeader } from '/src/js/header-home.js';

        function loadComponent(id, filePath, callback) {
            fetch(filePath)
                .then(res => {
                    if (!res.ok) throw new Error("Không tìm thấy file: " + filePath);
                    return res.text();
                })
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                    if (callback) callback(); // Chạy JS riêng khi load xong component
                })
                .catch(err => console.error(err));
        }

        // 1. Nạp file home.html vào header
        loadComponent('header-home-container', '/components/header/home.html', initHeader);

        // 2. Nạp file homepage.html vào body (không có callback vì chưa thấy import JS riêng cho homepage)
        loadComponent('homepage-container', '/components/homepage.html'); 
        
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Shopping</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <!-- 1. CÁC KHUNG CHỨA-->
    <!-- Đây là các vùng trống để JavaScript bơm nội dung vào -->
    <div id="header-container"></div>
    <div id="main-container"></div>

    <script type="module">
      // Hàm fetch đọc file HTML và nhét vào div
      function loadComponent(id, filePath) {
        fetch(filePath)
          .then(res => {
            if (!res.ok) throw new Error("Không tìm thấy file: " + filePath);
            return res.text();
          })
          .then(data => document.getElementById(id).innerHTML = data)
          .catch(err => console.error(err));
      }
      
      // 2. DANH SÁCH ĐƯỜNG DẪN TRANG (ROUTES)
      const routes = {
        'home': '/src/components/homepage.html',
        'shop': '/src/components/shoppage.html',
        'product': '/src/components/productpage.html',
        'minicart': '/src/components/minicart.html',
        'cart': '/src/components/cartpage.html',
        'checkout': '/src/components/checkout.html',

        // Nhóm Account
        'sign-in': '/src/components/account/sign-in.html',
        'forget-password': '/src/components/account/forget-password.html',
        'confirmation': '/src/components/account/confirmation.html',
        'new-password': '/src/components/account/new-password.html',
        'sign-up': '/src/components/account/sign-up.html',
      };

      // 3, HÀM XỬ LÝ LOGIC CHUYỂN TRANG
      function renderPage() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page') || 'home';
        
        // Nếu nhập sai tên trang trên URL, mặc định đưa về trang home
        const filePath = routes[page] || routes['home'];

        //--- XỬ LÝ LOGIC CHỌN HEADER TÙY THEO TRANG ---
        if (page === 'home') {
            loadComponent('header-container', '/src/components/header/home.html');
            
        } else if (page === 'sign-in' || page === 'sign-up' || page === 'forget-password' || page === 'new-password') {
            document.getElementById('header-container').innerHTML = ''; 

        } else {
            loadComponent('header-container', '/src/components/header/sub.html'); 
        }

        loadComponent('main-container', filePath);
      }

      // 4. CHẠY HÀM KHI NGƯỜI DÙNG TRUY CẬP
      renderPage();

      // Tự động cập nhật trang khi user bấm Back/Forward trên trình duyệt
      window.addEventListener('popstate', renderPage);
    </script>
  </body>
</html>
